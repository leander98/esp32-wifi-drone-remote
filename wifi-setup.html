<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18212f">
  <title>Drone Remote Wi-Fi Setup</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #eef2f7;
      color: #18212f;
    }
    main {
      width: min(100%, 430px);
      padding: 24px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 40px #18212f22;
    }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    p { color: #566274; line-height: 1.45; }
    label { display: block; margin-top: 18px; font-weight: 700; }
    input, select {
      width: 100%;
      min-height: 48px;
      margin-top: 7px;
      padding: 10px 12px;
      border: 1px solid #aab3c0;
      border-radius: 10px;
      font: inherit;
      font-size: 16px;
    }
    .network-row { display: flex; gap: 8px; align-items: end; }
    .network-row select { flex: 1; }
    .refresh { flex: 0 0 auto; min-width: 48px; padding: 10px; background: #e3e8ef;
      color: #18212f; font-size: 1.2rem; }
    [hidden] { display: none; }
    button, a {
      display: inline-grid;
      place-items: center;
      min-height: 48px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    button { flex: 1; background: #e63946; color: white; }
    a { background: #e3e8ef; color: #18212f; }
    #status { min-height: 24px; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Connect to Wi-Fi</h1>
    <p>
      Enter the network the ESP32 should join. The controller will restart
      after saving. If the connection fails, its own access point returns.
    </p>
    <form id="wifi-form">
      <label for="network">Available networks</label>
      <div class="network-row">
        <select id="network" required>
          <option value="">Scanning for networks…</option>
        </select>
        <button class="refresh" id="refresh" type="button"
                aria-label="Scan again" title="Scan again">↻</button>
      </div>
      <input id="ssid" maxlength="32" autocomplete="off"
             placeholder="Network name" aria-label="Network name" hidden>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" maxlength="64"
             autocomplete="current-password">

      <div class="actions">
        <a href="/">Cancel</a>
        <button type="submit">Save and connect</button>
      </div>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector("#wifi-form");
    const status = document.querySelector("#status");
    const network = document.querySelector("#network");
    const ssid = document.querySelector("#ssid");
    const refresh = document.querySelector("#refresh");

    function updateManualEntry() {
      const manual = network.value === "__manual__";
      ssid.hidden = !manual;
      ssid.required = manual;
      if (manual) ssid.focus();
    }

    async function scanNetworks() {
      refresh.disabled = true;
      network.disabled = true;
      status.textContent = "Scanning for nearby networks…";
      try {
        const response = await fetch("/api/wifi-scan", { cache: "no-store" });
        if (!response.ok) throw new Error(await response.text());
        const networks = await response.json();
        network.replaceChildren();
        for (const entry of networks) {
          const quality = entry.rssi >= -60 ? "strong" :
            entry.rssi >= -75 ? "medium" : "weak";
          network.add(new Option(`${entry.ssid} (${quality})`, entry.ssid));
        }
        network.add(new Option("Enter a network manually…", "__manual__"));
        if (networks.length === 0) network.value = "__manual__";
        status.textContent = networks.length === 0 ?
          "No visible networks found. Enter the network name manually." : "";
      } catch (error) {
        network.replaceChildren(
          new Option("Enter a network manually…", "__manual__"));
        status.textContent = `Could not scan: ${error.message}`;
      } finally {
        network.disabled = false;
        refresh.disabled = false;
        updateManualEntry();
      }
    }

    network.addEventListener("change", updateManualEntry);
    refresh.addEventListener("click", scanNetworks);
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      const selectedSsid = network.value === "__manual__" ?
        ssid.value.trim() : network.value;
      if (!selectedSsid) {
        status.textContent = "Select a network or enter its name.";
        return;
      }
      button.disabled = true;
      status.textContent = "Saving configuration…";
      try {
        const response = await fetch("/api/wifi-config", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            ssid: selectedSsid,
            password: form.password.value,
          }),
        });
        if (!response.ok) throw new Error(await response.text());
        status.textContent =
          "Saved. The ESP32 is restarting; reconnect to the configured network.";
      } catch (error) {
        status.textContent = `Could not save: ${error.message}`;
        button.disabled = false;
      }
    });
    scanNetworks();
  </script>
</body>
</html>

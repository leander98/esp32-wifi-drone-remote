<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18212f">
  <title>Access Point Settings</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #18212f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; padding: 20px; background: #eef2f7; }
    main {
      width: min(100%, 460px); margin: auto; padding: 24px;
      border-radius: 18px; background: white; box-shadow: 0 12px 40px #18212f22;
    }
    header { display: flex; align-items: center; gap: 14px; }
    h1 { margin: 0; font-size: 1.45rem; }
    a { padding: 10px 13px; border-radius: 10px; background: #e3e8ef;
        color: inherit; text-decoration: none; }
    label { display: block; margin-top: 18px; font-weight: 700; }
    input, select {
      width: 100%; min-height: 48px; margin-top: 7px; padding: 10px 12px;
      border: 1px solid #aab3c0; border-radius: 10px; font: inherit;
      font-size: 16px; background: white;
    }
    .check { display: flex; align-items: center; gap: 9px; font-weight: 500; }
    .check input { width: 22px; min-height: 22px; margin: 0; }
    button {
      width: 100%; min-height: 48px; margin-top: 24px; border: 0;
      border-radius: 10px; background: #e63946; color: white;
      font: inherit; font-weight: 750;
    }
    small, #status { display: block; margin-top: 6px; color: #657184; }
  </style>
</head>
<body>
  <main>
    <header><a href="/settings">Back</a><h1>Wi-Fi access point</h1></header>
    <form id="ap-form">
      <label for="ssid">SSID</label>
      <input id="ssid" name="ssid" maxlength="32" required>

      <label for="password">New password</label>
      <input id="password" name="password" type="password" minlength="8"
             maxlength="63">
      <small>Leave blank to keep the existing password.</small>

      <label class="check">
        <input id="open" name="open" type="checkbox" value="1">
        Create an open network without a password
      </label>

      <label for="clients">Maximum connected devices</label>
      <input id="clients" name="clients" type="number" min="1" max="10" required>

      <label for="tx_power">Signal strength</label>
      <select id="tx_power" name="tx_power">
        <option value="20">Low — 5 dBm</option>
        <option value="40">Medium — 10 dBm</option>
        <option value="60">High — 15 dBm</option>
        <option value="78">Maximum — 19.5 dBm</option>
      </select>

      <button type="submit">Save and restart</button>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector("#ap-form");
    const status = document.querySelector("#status");
    const password = document.querySelector("#password");
    const openNetwork = document.querySelector("#open");
    openNetwork.onchange = () => {
      password.disabled = openNetwork.checked;
      if (openNetwork.checked) password.value = "";
    };

    async function loadSettings() {
      const response = await fetch("/api/ap-config", { cache: "no-store" });
      const config = await response.json();
      form.ssid.value = config.ssid;
      form.clients.value = config.max_connections;
      form.tx_power.value = config.tx_power;
      status.textContent = config.password_set
        ? "A password is currently configured." : "The network is currently open.";
    }
    loadSettings().catch(() => status.textContent = "Could not load settings.");

    form.onsubmit = async (event) => {
      event.preventDefault();
      status.textContent = "Saving…";
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const response = await fetch("/api/ap-config", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(new FormData(form)),
        });
        if (!response.ok) throw new Error(await response.text());
        status.textContent = "Saved. The ESP32 is restarting.";
      } catch (error) {
        status.textContent = `Could not save: ${error.message}`;
        button.disabled = false;
      }
    };
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#18212f">
  <title>ESP32 Drone Remote</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #242424;
      background: #f5f7fa;
      --page: #f5f7fa;
      --panel: #fff;
      --text: #242424;
      --muted: #7b8491;
      --stick-center: #d2d5da;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      min-height: 100dvh;
      overscroll-behavior: none;
      color: var(--text);
      background: var(--page);
      transition: color .2s, background .2s;
    }
    body.dark {
      --page: #0e131b;
      --panel: #1a2230;
      --text: #eef3f8;
      --muted: #a9b4c2;
      --stick-center: #3b4655;
    }
    header {
      height: 56px;
      padding: max(7px, env(safe-area-inset-top))
               max(10px, env(safe-area-inset-right)) 7px
               max(10px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #18212f;
      color: white;
    }
    .status { font-size: .85rem; opacity: .8; }
    .toolbar { display: flex; gap: 8px; }
    .network-status {
      display: none;
      align-items: center;
      gap: 9px;
      min-width: 116px;
      font-size: .83rem;
      font-variant-numeric: tabular-nums;
    }
    :fullscreen .network-status { display: flex; }
    :-webkit-full-screen .network-status { display: flex; }
    .signal {
      height: 22px;
      display: flex;
      align-items: end;
      gap: 2px;
    }
    .signal i {
      display: block;
      width: 4px;
      border-radius: 2px;
      background: #667386;
    }
    .signal i:nth-child(1) { height: 5px; }
    .signal i:nth-child(2) { height: 10px; }
    .signal i:nth-child(3) { height: 15px; }
    .signal i:nth-child(4) { height: 20px; }
    .signal[data-bars="1"] i:nth-child(-n+1),
    .signal[data-bars="2"] i:nth-child(-n+2),
    .signal[data-bars="3"] i:nth-child(-n+3),
    .signal[data-bars="4"] i:nth-child(-n+4) { background: #54d17a; }
    .signal.latency-warning i { background: #ef3f4c !important; }
    button {
      border: 0;
      border-radius: 12px;
      background: #e63946;
      color: white;
      min-height: 42px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #3b4c63; }
    .controls {
      display: grid;
      grid-template-columns: 1fr minmax(180px, .55fr) 1fr;
      gap: clamp(8px, 2vw, 24px);
      align-items: center;
      max-width: 1100px;
      margin: auto;
      height: calc(100dvh - 56px);
      padding: 8px max(8px, env(safe-area-inset-right))
               max(8px, env(safe-area-inset-bottom))
               max(8px, env(safe-area-inset-left));
    }
    .stick-card { text-align: center; }
    .stick {
      position: relative;
      width: min(38vw, calc(100dvh - 105px), 310px);
      aspect-ratio: 1;
      border: 2px solid #303846;
      border-radius: 50%;
      margin: auto;
      background: radial-gradient(
        circle, var(--stick-center) 0 24%, var(--panel) 25%
      );
      touch-action: none;
    }
    .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 31%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #aeb4bd;
      transform: translate(-50%, -50%);
      box-shadow: 0 5px 16px #0003;
    }
    .label {
      position: absolute;
      color: #d21f2b;
      font-weight: 750;
      pointer-events: none;
    }
    .up { top: 8%; left: 50%; transform: translateX(-50%); }
    .down { bottom: 8%; left: 50%; transform: translateX(-50%); }
    .left { left: 5%; top: 50%; transform: translateY(-50%); }
    .right { right: 5%; top: 50%; transform: translateY(-50%); }
    .center { display: grid; gap: 12px; }
    .center button { width: 100%; }
    .telemetry {
      height: 170px;
      border: 1px solid #9ba4b2;
      border-radius: 14px;
      background: var(--panel);
      display: grid;
      place-items: center;
      color: #7b8491;
    }
    .rotate-message {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      padding: 30px;
      place-items: center;
      text-align: center;
      background: #18212f;
      color: white;
      font-size: 1.2rem;
    }
    @media (orientation: portrait) and (max-width: 760px) {
      .rotate-message { display: grid; }
    }
    @media (max-height: 500px) {
      h2 { margin: 2px 0 5px; font-size: 1rem; }
      .telemetry { height: 70px; }
      .center { gap: 6px; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <b>ESP32 Drone Remote</b>
      <div class="status" id="status">Ready</div>
    </div>
    <div class="network-status" aria-live="polite">
      <span class="signal" id="signal" data-bars="0"
            aria-label="Signal unavailable"><i></i><i></i><i></i><i></i></span>
      <span id="network-mode">--</span>
      <span id="ping">-- ms</span>
    </div>
    <div class="toolbar">
      <button id="fullscreen" class="secondary">Fullscreen</button>
      <button id="connect">Connect</button>
      <button id="settings" class="secondary">Settings</button>
    </div>
  </header>
  <main class="controls">
    <section class="stick-card">
      <h2>Throttle / Turn</h2>
      <div class="stick" data-stick="left">
        <span class="label up">Thrust</span>
        <span class="label down">Down</span>
        <span class="label left">Turn left</span>
        <span class="label right">Turn right</span>
        <div class="knob"></div>
      </div>
    </section>
    <section class="center">
      <div class="toolbar">
        <button data-api="turn-lock">Turn lock</button>
        <button id="brightness" class="secondary"
                data-api="brightness">Brightness</button>
      </div>
      <div class="toolbar">
        <button class="secondary" data-api="headlight">Headlight</button>
        <button class="secondary" data-api="sound">Sound</button>
      </div>
      <div class="telemetry">Telemetry placeholder</div>
    </section>
    <section class="stick-card">
      <h2>Direction</h2>
      <div class="stick" data-stick="right">
        <span class="label up">Forward</span>
        <span class="label down">Backward</span>
        <span class="label left">Left</span>
        <span class="label right">Right</span>
        <div class="knob"></div>
      </div>
    </section>
  </main>
  <div class="rotate-message">
    Rotate your phone to landscape orientation to use the controller.
  </div>
  <script>
    const statusEl = document.querySelector("#status");
    const signalEl = document.querySelector("#signal");
    const pingEl = document.querySelector("#ping");
    const networkModeEl = document.querySelector("#network-mode");
    let statusTimer;

    try {
      document.body.classList.toggle(
        "dark", localStorage.getItem("drone-theme") === "dark"
      );
    } catch (error) {}

    async function send(name, body = {}) {
      statusEl.textContent = `Sending ${name}…`;
      try {
        const response = await fetch(`/api/${name}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        statusEl.textContent =
          response.ok ? "Ready" : `Request failed: ${response.status}`;
      } catch (error) {
        statusEl.textContent = "Connection lost";
      }
    }

    document.querySelectorAll("[data-api]").forEach((button) => {
      button.onclick = () => send(button.dataset.api);
    });
    document.querySelector("#brightness").addEventListener("click", () => {
      const dark = document.body.classList.toggle("dark");
      try {
        localStorage.setItem("drone-theme", dark ? "dark" : "light");
      } catch (error) {}
    });
    document.querySelector("#connect").onclick = () => {
      window.location.href = "/wifi";
    };
    document.querySelector("#settings").onclick = () => {
      window.location.href = "/settings";
    };

    async function lockLandscape() {
      if (!screen.orientation?.lock) return false;
      try {
        await screen.orientation.lock("landscape-primary");
        return true;
      } catch (primaryError) {
        try {
          await screen.orientation.lock("landscape");
          return true;
        } catch (landscapeError) {
          return false;
        }
      }
    }

    document.querySelector("#fullscreen").onclick = async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          if (!await lockLandscape()) {
            statusEl.textContent =
              "Fullscreen active; this browser cannot lock orientation";
          }
        } else {
          if (screen.orientation?.unlock) screen.orientation.unlock();
          await document.exitFullscreen();
        }
      } catch (error) {
        statusEl.textContent = "Fullscreen is unavailable in this browser";
      }
    };

    async function updateNetworkStatus() {
      const started = performance.now();
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        const info = await response.json();
        const ping = Math.round(performance.now() - started);
        const bars = info.rssi >= -55 ? 4
          : info.rssi >= -65 ? 3
          : info.rssi >= -75 ? 2
          : info.rssi > -127 ? 1 : 0;
        signalEl.dataset.bars = bars;
        signalEl.setAttribute(
          "aria-label", bars ? `Signal ${info.rssi} dBm` : "Signal unavailable"
        );
        networkModeEl.textContent = info.mode.toUpperCase();
        pingEl.textContent = `${ping} ms`;
        signalEl.classList.toggle(
          "latency-warning", ping > info.timeout_ms
        );
        fetch("/api/latency", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ latency_ms: ping }),
          keepalive: true,
        }).catch(() => {});
      } catch (error) {
        signalEl.dataset.bars = 0;
        signalEl.classList.add("latency-warning");
        networkModeEl.textContent = "--";
        pingEl.textContent = "-- ms";
      }
    }

    function fullscreenChanged() {
      const fullscreen = document.fullscreenElement
        || document.webkitFullscreenElement;
      clearInterval(statusTimer);
      if (fullscreen) {
        lockLandscape();
        updateNetworkStatus();
        statusTimer = setInterval(updateNetworkStatus, 2000);
      } else if (screen.orientation?.unlock) {
        screen.orientation.unlock();
      }
    }
    document.addEventListener("fullscreenchange", fullscreenChanged);
    document.addEventListener("webkitfullscreenchange", fullscreenChanged);

    document.querySelectorAll("[data-stick]").forEach((stick) => {
      let active = false;
      let lastSentAt = 0;
      const knob = stick.querySelector(".knob");
      const name = `${stick.dataset.stick}-stick`;

      function move(event) {
        if (!active) return;
        const bounds = stick.getBoundingClientRect();
        let x = (event.clientX - bounds.left - bounds.width / 2)
          / (bounds.width / 2);
        let y = (bounds.top + bounds.height / 2 - event.clientY)
          / (bounds.height / 2);
        const magnitude = Math.hypot(x, y);
        if (magnitude > 1) {
          x /= magnitude;
          y /= magnitude;
        }
        knob.style.transform =
          `translate(calc(-50% + ${x * bounds.width * .32}px), `
          + `calc(-50% + ${-y * bounds.height * .32}px))`;
        const now = performance.now();
        if (now - lastSentAt >= 50) {
          lastSentAt = now;
          send(name, { x: +x.toFixed(3), y: +y.toFixed(3) });
        }
      }

      stick.onpointerdown = (event) => {
        active = true;
        stick.setPointerCapture(event.pointerId);
        move(event);
      };
      stick.onpointermove = move;
      stick.onpointerup = stick.onpointercancel = () => {
        active = false;
        lastSentAt = 0;
        knob.style.transform = "translate(-50%, -50%)";
        send(name, { x: 0, y: 0 });
      };
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#18212f">
  <title>ESP32 Drone Remote</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #242424;
      background: #f5f7fa;
      --page: #f5f7fa;
      --panel: #fff;
      --text: #242424;
      --muted: #7b8491;
      --stick-center: #d2d5da;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      min-height: 100dvh;
      overscroll-behavior: none;
      color: var(--text);
      background: var(--page);
      transition: color .2s, background .2s;
    }
    body.dark {
      --page: #0e131b;
      --panel: #1a2230;
      --text: #eef3f8;
      --muted: #a9b4c2;
      --stick-center: #3b4655;
    }
    header {
      height: 56px;
      padding: max(7px, env(safe-area-inset-top))
               max(10px, env(safe-area-inset-right)) 7px
               max(10px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #18212f;
      color: white;
    }
    .status { font-size: .85rem; opacity: .8; }
    .toolbar { display: flex; gap: 8px; }
    .network-status {
      display: none;
      align-items: center;
      gap: 9px;
      min-width: 116px;
      font-size: .83rem;
      font-variant-numeric: tabular-nums;
    }
    :fullscreen .network-status { display: flex; }
    :-webkit-full-screen .network-status { display: flex; }
    .signal {
      height: 22px;
      display: flex;
      align-items: end;
      gap: 2px;
    }
    .signal i {
      display: block;
      width: 4px;
      border-radius: 2px;
      background: #667386;
    }
    .signal i:nth-child(1) { height: 5px; }
    .signal i:nth-child(2) { height: 10px; }
    .signal i:nth-child(3) { height: 15px; }
    .signal i:nth-child(4) { height: 20px; }
    .signal[data-bars="1"] i:nth-child(-n+1),
    .signal[data-bars="2"] i:nth-child(-n+2),
    .signal[data-bars="3"] i:nth-child(-n+3),
    .signal[data-bars="4"] i:nth-child(-n+4) { background: #54d17a; }
    .signal.latency-warning i { background: #ef3f4c !important; }
    button {
      border: 0;
      border-radius: 12px;
      background: #e63946;
      color: white;
      min-height: 42px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #3b4c63; }
    #arm.arm-disarmed { background: #218739; }
    #arm.arm-armed {
      background: #d21f2b;
      box-shadow: 0 0 0 3px #ffb3b8;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr minmax(180px, .55fr) 1fr;
      gap: clamp(8px, 2vw, 24px);
      align-items: center;
      max-width: 1100px;
      margin: auto;
      height: calc(100dvh - 56px);
      padding: 8px max(8px, env(safe-area-inset-right))
               max(8px, env(safe-area-inset-bottom))
               max(8px, env(safe-area-inset-left));
    }
    .stick-card { text-align: center; }
    .stick {
      position: relative;
      width: min(38vw, calc(100dvh - 105px), 310px);
      aspect-ratio: 1;
      border: 2px solid #303846;
      border-radius: 50%;
      margin: auto;
      background: radial-gradient(
        circle, var(--stick-center) 0 24%, var(--panel) 25%
      );
      touch-action: none;
    }
    .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 31%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #aeb4bd;
      transform: translate(-50%, -50%);
      box-shadow: 0 5px 16px #0003;
    }
    .label {
      position: absolute;
      color: #d21f2b;
      font-weight: 750;
      pointer-events: none;
    }
    .up { top: 8%; left: 50%; transform: translateX(-50%); }
    .down { bottom: 8%; left: 50%; transform: translateX(-50%); }
    .left { left: 5%; top: 50%; transform: translateY(-50%); }
    .right { right: 5%; top: 50%; transform: translateY(-50%); }
    .center { display: grid; gap: 12px; }
    .center button { width: 100%; }
    .telemetry {
      height: 170px;
      border: 1px solid #9ba4b2;
      border-radius: 14px;
      background: var(--panel);
      display: grid;
      place-items: center;
      color: #7b8491;
      position: relative;
      overflow: hidden;
    }
    .telemetry canvas { width: 100%; height: 100%; display: block; }
    .telemetry.disabled canvas { display: none; }
    .telemetry.disabled .telemetry-values {
      inset: 0;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--muted);
      font: 600 12px system-ui;
    }
    .telemetry-values {
      position: absolute;
      left: 7px;
      bottom: 5px;
      padding: 3px 5px;
      border-radius: 5px;
      background: #0008;
      color: white;
      font: 10px/1.3 ui-monospace, monospace;
      pointer-events: none;
    }
    .rotate-message {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      padding: 30px;
      place-items: center;
      text-align: center;
      background: #18212f;
      color: white;
      font-size: 1.2rem;
    }
    @media (orientation: portrait) and (max-width: 760px) {
      .rotate-message { display: grid; }
    }
    @media (max-height: 500px) {
      h2 { margin: 2px 0 5px; font-size: 1rem; }
      .telemetry { height: 70px; }
      .center { gap: 6px; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <b>ESP32 Drone Remote</b>
      <div class="status" id="status">Ready</div>
    </div>
    <div class="network-status" aria-live="polite">
      <span class="signal" id="signal" data-bars="0"
            aria-label="Signal unavailable"><i></i><i></i><i></i><i></i></span>
      <span id="network-mode">--</span>
      <span id="ping">-- ms</span>
    </div>
    <div class="toolbar">
      <button id="fullscreen" class="secondary">Fullscreen</button>
      <button id="connect">Connect</button>
      <button id="settings" class="secondary">Settings</button>
    </div>
  </header>
  <main class="controls">
    <section class="stick-card">
      <h2>Throttle / Turn</h2>
      <div class="stick" data-stick="left">
        <span class="label up">Thrust</span>
        <span class="label down">Down</span>
        <span class="label left">Turn left</span>
        <span class="label right">Turn right</span>
        <div class="knob"></div>
      </div>
    </section>
    <section class="center">
      <div class="toolbar">
        <button id="arm" class="arm-disarmed"
                aria-pressed="false">Arm motors</button>
        <button data-api="turn-lock">Turn lock</button>
        <button id="brightness" class="secondary"
                data-api="brightness">Brightness</button>
      </div>
      <div class="toolbar">
        <button class="secondary" data-api="headlight">Headlight</button>
        <button class="secondary" data-api="sound">Sound</button>
      </div>
      <button id="attitude-toggle" class="secondary"
              aria-pressed="false">Enable attitude</button>
      <div class="telemetry disabled" id="telemetry">
        <canvas id="attitude" aria-label="IMU attitude indicator"></canvas>
        <div class="telemetry-values" id="telemetry-values">
          Attitude indicator disabled
        </div>
      </div>
    </section>
    <section class="stick-card">
      <h2>Direction</h2>
      <div class="stick" data-stick="right">
        <span class="label up">Forward</span>
        <span class="label down">Backward</span>
        <span class="label left">Left</span>
        <span class="label right">Right</span>
        <div class="knob"></div>
      </div>
    </section>
  </main>
  <div class="rotate-message">
    Rotate your phone to landscape orientation to use the controller.
  </div>
  <script>
    const statusEl = document.querySelector("#status");
    const signalEl = document.querySelector("#signal");
    const pingEl = document.querySelector("#ping");
    const networkModeEl = document.querySelector("#network-mode");
    const attitudeCanvas = document.querySelector("#attitude");
    const telemetryElement = document.querySelector("#telemetry");
    const telemetryValues = document.querySelector("#telemetry-values");
    const attitudeToggle = document.querySelector("#attitude-toggle");
    const attitudeContext = attitudeCanvas.getContext("2d");
    let statusTimer;
    let telemetryTimer;
    let telemetryEnabled = false;
    let flightArmed = false;
    let flightHeartbeatTimer;
    let resetThrottleControl = async () => {};
    let roll = 0;
    let pitch = 0;
    let yaw = 0;
    let previousTelemetryAt;

    try {
      document.body.classList.toggle(
        "dark", localStorage.getItem("drone-theme") === "dark"
      );
    } catch (error) {}

    async function send(name, body = {}) {
      statusEl.textContent = `Sending ${name}…`;
      try {
        const response = await fetch(`/api/${name}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        statusEl.textContent =
          response.ok ? "Ready" : `Request failed: ${response.status}`;
      } catch (error) {
        statusEl.textContent = "Connection lost";
      }
    }

    document.querySelectorAll("[data-api]").forEach((button) => {
      button.onclick = () => send(button.dataset.api);
    });
    document.querySelector("#brightness").addEventListener("click", () => {
      const dark = document.body.classList.toggle("dark");
      try {
        localStorage.setItem("drone-theme", dark ? "dark" : "light");
      } catch (error) {}
    });
    document.querySelector("#connect").onclick = () => {
      window.location.href = "/wifi";
    };
    document.querySelector("#settings").onclick = () => {
      window.location.href = "/settings";
    };
    const armButton = document.querySelector("#arm");

    function displayArmingState() {
      armButton.textContent = flightArmed ? "Disarm motors" : "Arm motors";
      armButton.classList.toggle("arm-armed", flightArmed);
      armButton.classList.toggle("arm-disarmed", !flightArmed);
      armButton.setAttribute("aria-pressed", String(flightArmed));
    }

    armButton.onclick = async () => {
      const requestedState = !flightArmed;
      armButton.disabled = true;
      try {
        if (requestedState) await resetThrottleControl();
        const response = await fetch("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ armed: requestedState }),
        });
        if (!response.ok) throw new Error(await response.text());
        flightArmed = requestedState;
        displayArmingState();
        clearInterval(flightHeartbeatTimer);
        if (flightArmed) {
          flightHeartbeatTimer = setInterval(() => {
            fetch("/api/settings", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ heartbeat: true }),
            }).catch(() => {});
          }, 250);
        }
        statusEl.textContent = flightArmed ? "Motors armed" : "Motors disarmed";
      } catch (error) {
        statusEl.textContent = `Could not change arming state: ${error.message}`;
      } finally {
        armButton.disabled = false;
      }
    };
    displayArmingState();
    addEventListener("pagehide", () => {
      if (flightArmed) navigator.sendBeacon(
        "/api/settings", new Blob(['{"armed":false}'],
          { type: "application/json" }));
    });

    async function lockLandscape() {
      if (!screen.orientation?.lock) return false;
      try {
        await screen.orientation.lock("landscape-primary");
        return true;
      } catch (primaryError) {
        try {
          await screen.orientation.lock("landscape");
          return true;
        } catch (landscapeError) {
          return false;
        }
      }
    }

    document.querySelector("#fullscreen").onclick = async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          if (!await lockLandscape()) {
            statusEl.textContent =
              "Fullscreen active; this browser cannot lock orientation";
          }
        } else {
          if (screen.orientation?.unlock) screen.orientation.unlock();
          await document.exitFullscreen();
        }
      } catch (error) {
        statusEl.textContent = "Fullscreen is unavailable in this browser";
      }
    };

    async function updateNetworkStatus() {
      const started = performance.now();
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        const info = await response.json();
        const ping = Math.round(performance.now() - started);
        const bars = info.rssi >= -55 ? 4
          : info.rssi >= -65 ? 3
          : info.rssi >= -75 ? 2
          : info.rssi > -127 ? 1 : 0;
        signalEl.dataset.bars = bars;
        signalEl.setAttribute(
          "aria-label", bars ? `Signal ${info.rssi} dBm` : "Signal unavailable"
        );
        networkModeEl.textContent = info.mode.toUpperCase();
        pingEl.textContent = `${ping} ms`;
        signalEl.classList.toggle(
          "latency-warning", ping > info.timeout_ms
        );
        fetch("/api/latency", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ latency_ms: ping }),
          keepalive: true,
        }).catch(() => {});
      } catch (error) {
        signalEl.dataset.bars = 0;
        signalEl.classList.add("latency-warning");
        networkModeEl.textContent = "--";
        pingEl.textContent = "-- ms";
      }
    }

    function drawAttitude() {
      const bounds = attitudeCanvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(bounds.width * scale));
      const height = Math.max(1, Math.round(bounds.height * scale));
      if (attitudeCanvas.width !== width || attitudeCanvas.height !== height) {
        attitudeCanvas.width = width;
        attitudeCanvas.height = height;
      }
      const context = attitudeContext;
      context.setTransform(scale, 0, 0, scale, 0, 0);
      context.clearRect(0, 0, bounds.width, bounds.height);

      const centerX = bounds.width / 2;
      const centerY = bounds.height / 2;
      const pixelsPerDegree = bounds.height / 55;
      const pitchOffset = pitch * pixelsPerDegree;
      const sceneSize = Math.max(bounds.width, bounds.height) * 3;

      /* Moving attitude sphere: sky, ground, horizon, and pitch ladder. */
      context.save();
      context.beginPath();
      context.rect(0, 0, bounds.width, bounds.height);
      context.clip();
      context.translate(centerX, centerY);
      context.rotate(-roll * Math.PI / 180);

      const sky = context.createLinearGradient(0, -sceneSize, 0, pitchOffset);
      sky.addColorStop(0, "#0b4f9c");
      sky.addColorStop(1, "#4db4ed");
      context.fillStyle = sky;
      context.fillRect(-sceneSize, -sceneSize + pitchOffset,
                       sceneSize * 2, sceneSize);

      const ground = context.createLinearGradient(
        0, pitchOffset, 0, sceneSize
      );
      ground.addColorStop(0, "#a86c35");
      ground.addColorStop(1, "#3f281d");
      context.fillStyle = ground;
      context.fillRect(-sceneSize, pitchOffset, sceneSize * 2, sceneSize);

      context.strokeStyle = "white";
      context.lineWidth = 2.5;
      context.beginPath();
      context.moveTo(-sceneSize, pitchOffset);
      context.lineTo(sceneSize, pitchOffset);
      context.stroke();

      context.font = "bold 9px system-ui";
      context.fillStyle = "white";
      context.textAlign = "center";
      context.textBaseline = "middle";
      for (let angle = -40; angle <= 40; angle += 5) {
        if (angle === 0) continue;
        const y = pitchOffset - angle * pixelsPerDegree;
        const major = angle % 10 === 0;
        const halfWidth = major ? 31 : 18;
        context.lineWidth = major ? 1.8 : 1;
        context.beginPath();
        context.moveTo(-halfWidth, y);
        context.lineTo(halfWidth, y);
        context.stroke();
        if (major) {
          context.fillText(Math.abs(angle), -halfWidth - 11, y);
          context.fillText(Math.abs(angle), halfWidth + 11, y);
        }
      }
      context.restore();

      /* Fixed bank scale with a moving roll pointer. */
      const bankRadius = Math.min(bounds.width, bounds.height) * .42;
      context.strokeStyle = "white";
      context.fillStyle = "white";
      context.lineWidth = 1.5;
      for (const bank of [-60, -45, -30, -20, -10, 0, 10, 20, 30, 45, 60]) {
        const angle = (-90 + bank) * Math.PI / 180;
        const longTick = bank % 30 === 0;
        const outerX = centerX + Math.cos(angle) * bankRadius;
        const outerY = centerY + Math.sin(angle) * bankRadius;
        const innerRadius = bankRadius - (longTick ? 9 : 5);
        context.beginPath();
        context.moveTo(outerX, outerY);
        context.lineTo(centerX + Math.cos(angle) * innerRadius,
                       centerY + Math.sin(angle) * innerRadius);
        context.stroke();
      }
      const pointerAngle = (-90 - roll) * Math.PI / 180;
      const pointerX = centerX + Math.cos(pointerAngle) * (bankRadius - 12);
      const pointerY = centerY + Math.sin(pointerAngle) * (bankRadius - 12);
      context.save();
      context.translate(pointerX, pointerY);
      context.rotate(pointerAngle + Math.PI / 2);
      context.fillStyle = "#ffdf45";
      context.beginPath();
      context.moveTo(0, -7);
      context.lineTo(-5, 3);
      context.lineTo(5, 3);
      context.closePath();
      context.fill();
      context.restore();

      /* Fixed aircraft reference wings and nose marker. */
      context.strokeStyle = "#ffdf45";
      context.lineWidth = 3.5;
      context.lineJoin = "round";
      context.beginPath();
      context.moveTo(centerX - 38, centerY);
      context.lineTo(centerX - 12, centerY);
      context.lineTo(centerX - 6, centerY + 7);
      context.moveTo(centerX + 6, centerY + 7);
      context.lineTo(centerX + 12, centerY);
      context.lineTo(centerX + 38, centerY);
      context.stroke();
      context.fillStyle = "#ffdf45";
      context.beginPath();
      context.arc(centerX, centerY + 7, 3.5, 0, Math.PI * 2);
      context.fill();

      /* Heading derived from integrated yaw. */
      context.fillStyle = "white";
      context.font = "bold 12px system-ui";
      context.textAlign = "center";
      context.fillText(`${Math.round((yaw + 360) % 360)}°`,
                       bounds.width / 2, 16);
    }

    async function updateTelemetry() {
      try {
        const response = await fetch("/api/telemetry", { cache: "no-store" });
        if (!response.ok) throw new Error();
        const sample = await response.json();
        const now = performance.now();
        const dt = previousTelemetryAt
          ? Math.min((now - previousTelemetryAt) / 1000, .25) : 0;
        previousTelemetryAt = now;
        const acceleration = sample.accelerometer;
        const gyroscope = sample.gyroscope;
        const accelerationRoll = Math.atan2(
          acceleration.y, acceleration.z
        ) * 180 / Math.PI;
        const accelerationPitch = Math.atan2(
          -acceleration.x,
          Math.hypot(acceleration.y, acceleration.z)
        ) * 180 / Math.PI;
        roll = .98 * (roll + gyroscope.x * dt) + .02 * accelerationRoll;
        pitch = .98 * (pitch + gyroscope.y * dt) + .02 * accelerationPitch;
        yaw = (yaw + gyroscope.z * dt + 360) % 360;
        telemetryValues.textContent =
          `A ${acceleration.x.toFixed(2)} ${acceleration.y.toFixed(2)} `
          + `${acceleration.z.toFixed(2)} g\n`
          + `G ${gyroscope.x.toFixed(1)} ${gyroscope.y.toFixed(1)} `
          + `${gyroscope.z.toFixed(1)} °/s`;
        telemetryValues.style.whiteSpace = "pre";
        drawAttitude();
      } catch (error) {
        telemetryValues.textContent = "IMU unavailable";
      }
    }

    function setTelemetryEnabled(enabled) {
      telemetryEnabled = enabled;
      clearInterval(telemetryTimer);
      telemetryTimer = undefined;
      telemetryElement.classList.toggle("disabled", !enabled);
      attitudeToggle.setAttribute("aria-pressed", String(enabled));
      attitudeToggle.textContent =
        enabled ? "Disable attitude" : "Enable attitude";

      if (enabled) {
        roll = 0;
        pitch = 0;
        yaw = 0;
        previousTelemetryAt = undefined;
        updateTelemetry();
        telemetryTimer = setInterval(updateTelemetry, 100);
      } else {
        telemetryValues.textContent = "Attitude indicator disabled";
        attitudeContext.clearRect(
          0, 0, attitudeCanvas.width, attitudeCanvas.height
        );
      }
    }
    attitudeToggle.addEventListener("click", () => {
      setTelemetryEnabled(!telemetryEnabled);
    });

    function fullscreenChanged() {
      const fullscreen = document.fullscreenElement
        || document.webkitFullscreenElement;
      clearInterval(statusTimer);
      if (fullscreen) {
        lockLandscape();
        updateNetworkStatus();
        statusTimer = setInterval(updateNetworkStatus, 2000);
      } else if (screen.orientation?.unlock) {
        screen.orientation.unlock();
      }
    }
    document.addEventListener("fullscreenchange", fullscreenChanged);
    document.addEventListener("webkitfullscreenchange", fullscreenChanged);
    setTelemetryEnabled(false);

    document.querySelectorAll("[data-stick]").forEach((stick) => {
      let active = false;
      let lastSentAt = 0;
      let currentX = 0;
      let currentY = stick.dataset.stick === "left" ? -1 : 0;
      const knob = stick.querySelector(".knob");
      const name = `${stick.dataset.stick}-stick`;

      function render() {
        const bounds = stick.getBoundingClientRect();
        knob.style.transform =
          `translate(calc(-50% + ${currentX * bounds.width * .32}px), `
          + `calc(-50% + ${-currentY * bounds.height * .32}px))`;
      }

      function move(event) {
        if (!active) return;
        const bounds = stick.getBoundingClientRect();
        let x = (event.clientX - bounds.left - bounds.width / 2)
          / (bounds.width / 2);
        let y = (bounds.top + bounds.height / 2 - event.clientY)
          / (bounds.height / 2);
        const magnitude = Math.hypot(x, y);
        if (magnitude > 1) {
          x /= magnitude;
          y /= magnitude;
        }
        currentX = x;
        currentY = y;
        render();
        const now = performance.now();
        if (now - lastSentAt >= 50) {
          lastSentAt = now;
          send(name, { x: +x.toFixed(3), y: +y.toFixed(3) });
        }
      }

      stick.onpointerdown = (event) => {
        active = true;
        stick.setPointerCapture(event.pointerId);
        move(event);
      };
      stick.onpointermove = move;
      stick.onpointerup = stick.onpointercancel = () => {
        active = false;
        lastSentAt = 0;
        currentX = 0;
        if (stick.dataset.stick !== "left") currentY = 0;
        render();
        send(name, { x: currentX, y: currentY });
      };

      if (stick.dataset.stick === "left") {
        resetThrottleControl = async () => {
          currentX = 0;
          currentY = -1;
          render();
          const response = await fetch("/api/left-stick", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ x: 0, y: -1 }),
          });
          if (!response.ok) throw new Error(await response.text());
        };
      }
      render();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18212f">
  <title>ISM330DLC Settings</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #18212f; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; padding:20px; background:#eef2f7; }
    main { width:min(100%,480px); margin:auto; padding:24px; border-radius:18px;
      background:white; box-shadow:0 12px 40px #18212f22; }
    header { display:flex; align-items:center; gap:14px; }
    h1 { margin:0; font-size:1.4rem; }
    a { padding:10px 13px; border-radius:10px; background:#e3e8ef;
      color:inherit; text-decoration:none; }
    label { display:block; margin-top:17px; font-weight:700; }
    select { width:100%; min-height:48px; margin-top:7px; padding:9px 11px;
      border:1px solid #aab3c0; border-radius:10px; background:white;
      font:16px system-ui; }
    button { width:100%; min-height:48px; margin-top:23px; border:0;
      border-radius:10px; background:#e63946; color:white; font:inherit;
      font-weight:750; }
    #status { color:#657184; min-height:24px; }
  </style>
</head>
<body><main>
  <header><a href="/settings">Back</a><h1>ISM330DLC IMU</h1></header>
  <form id="imu-form">
    <label for="preset">Acquisition mode</label>
    <select id="preset">
      <option value="normal">Default (normal)</option>
      <option value="slow">Slow</option>
      <option value="high">High speed</option>
      <option value="custom">Custom</option>
    </select>
    <label for="accel_odr">Accelerometer data rate</label>
    <select id="accel_odr" name="accel_odr"></select>
    <label for="gyro_odr">Gyroscope data rate</label>
    <select id="gyro_odr" name="gyro_odr"></select>
    <label for="accel_scale">Accelerometer range</label>
    <select id="accel_scale" name="accel_scale">
      <option value="0">±2 g</option><option value="2">±4 g</option>
      <option value="3">±8 g</option><option value="1">±16 g</option>
    </select>
    <label for="gyro_scale">Gyroscope range</label>
    <select id="gyro_scale" name="gyro_scale">
      <option value="0">±250 dps</option><option value="1">±500 dps</option>
      <option value="2">±1000 dps</option><option value="3">±2000 dps</option>
    </select>
    <button type="submit">Apply settings</button>
    <button type="button" id="align" style="background:#3b4c63">
      Align IMU level
    </button>
    <p id="status" role="status"></p>
  </form>
  <script>
    const rates = [["0","Power down"],["1","12.5 Hz"],["2","26 Hz"],
      ["3","52 Hz"],["4","104 Hz"],["5","208 Hz"],["6","416 Hz"],
      ["7","833 Hz"],["8","1660 Hz"],["9","3330 Hz"],["10","6660 Hz"]];
    for (const id of ["accel_odr","gyro_odr"]) {
      const select = document.querySelector(`#${id}`);
      rates.forEach(([value,label]) => select.add(new Option(label,value)));
    }
    const form = document.querySelector("#imu-form");
    const preset = document.querySelector("#preset");
    const status = document.querySelector("#status");
    const align = document.querySelector("#align");
    const modes = {
      normal: {accel_odr:6,gyro_odr:6,accel_scale:2,gyro_scale:3},
      slow: {accel_odr:3,gyro_odr:3,accel_scale:0,gyro_scale:1},
      high: {accel_odr:10,gyro_odr:10,accel_scale:1,gyro_scale:3},
    };
    function apply(values) {
      Object.entries(values).forEach(([key,value]) => form[key].value=value);
    }
    preset.onchange = () => {
      if (modes[preset.value]) apply(modes[preset.value]);
    };
    form.querySelectorAll("select[name]").forEach((select) => {
      select.onchange = () => preset.value = "custom";
    });
    async function load() {
      const response = await fetch("/api/imu-config",{cache:"no-store"});
      if (!response.ok) throw new Error(await response.text());
      const values = await response.json();
      apply(values);
      preset.value = "custom";
      for (const [name, mode] of Object.entries(modes)) {
        if (Object.keys(mode).every(key => +form[key].value === mode[key])) {
          preset.value = name;
        }
      }
    }
    load().catch(error => status.textContent=`Could not load: ${error.message}`);
    form.onsubmit = async event => {
      event.preventDefault(); status.textContent="Applying…";
      const response = await fetch("/api/imu-config", {
        method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:new URLSearchParams(new FormData(form)),
      });
      status.textContent = response.ok ? "Settings applied." :
        `Could not apply: ${await response.text()}`;
    };
    align.onclick = async () => {
      align.disabled = true;
      status.textContent = "Aligning…";
      try {
        const response = await fetch("/api/settings", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({align_imu:true}),
        });
        if (!response.ok) throw new Error(await response.text());
        status.textContent = "IMU level aligned.";
      } catch (error) {
        status.textContent = `Could not align: ${error.message}`;
      } finally {
        align.disabled = false;
      }
    };
  </script>
</main></body></html>
